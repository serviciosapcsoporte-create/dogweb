  <!-- 3. Pastor aleman mechudo: melena jagged, orejas erguidas -->
  <g transform="translate(244,6)">
    <path d="M28 36 L22 6 L46 28 Z" fill="#0F2C59" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M92 36 L98 6 L74 28 Z" fill="#0F2C59" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M26 52 l-9 10 9 4 -8 12 11 3 -5 13 13 -3 3 12 6 -9 5 10 5 -10 6 9 3 -12 13 3 -5 -13 11 -3 -8 -12 9 -4 -9 -10 z" fill="#0F2C59" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="60" cy="60" rx="28" ry="31" fill="#0F2C59" stroke="#fff" stroke-width="4.5"/>
    <path d="M48 76 Q60 92 72 76" fill="#b45309" opacity="0.9"/>
    <path d="M52 68 Q60 78 68 68" fill="#25d366"/>
    <circle cx="49" cy="55" r="3" fill="#fff"/><circle cx="71" cy="55" r="3" fill="#fff"/>
    <ellipse cx="60" cy="66" rx="4.5" ry="3.6" fill="#fff"/>
    <rect x="45" y="100" width="30" height="8" rx="4" fill="#ffd100"/>
  </g>

  <!-- 4. Perra criolla negra con pecho blanco: orejas semicaidas -->
  <g transform="translate(368,10)">
    <path d="M28 44 Q18 26 30 18 Q40 24 42 42" fill="#0F2C59" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M92 44 Q102 26 90 18 Q80 24 78 42" fill="#0F2C59" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="60" cy="60" rx="30" ry="33" fill="#0F2C59" stroke="#fff" stroke-width="5"/>
    <path d="M48 79 Q60 102 72 79 L72 96 Q60 110 48 96 Z" fill="#fff" opacity="0.95"/>
    <path d="M50 69 Q60 81 70 69" fill="#25d366"/>
    <circle cx="49" cy="54" r="3.2" fill="#fff"/><circle cx="71" cy="54" r="3.2" fill="#fff"/>
    <ellipse cx="60" cy="66" rx="5" ry="4" fill="#fff"/>
    <path d="M52 77 Q60 85 68 77" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="45" y="96" width="30" height="8" rx="4" fill="#ffd100"/>
